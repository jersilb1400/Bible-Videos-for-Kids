<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Daniel's window room: warm, morning light -->
  <defs>
    <linearGradient id="roomWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e0d0"/>
      <stop offset="100%" stop-color="#d8c8b0"/>
    </linearGradient>
  </defs>
  <!-- Wall -->
  <rect x="0" y="0" width="1920" height="820" fill="url(#roomWall)"/>
  <!-- Floor (wood) -->
  <rect x="0" y="820" width="1920" height="260" fill="#b89070" stroke="#9a704a" stroke-width="1"/>
  <line x1="0" y1="850" x2="1920" y2="850" stroke="#8a6030" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="920" x2="1920" y2="920" stroke="#8a6030" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="990" x2="1920" y2="990" stroke="#8a6030" stroke-width="1" opacity="0.4"/>
  <line x1="480" y1="820" x2="480" y2="1080" stroke="#8a6030" stroke-width="1" opacity="0.3"/>
  <line x1="960" y1="820" x2="960" y2="1080" stroke="#8a6030" stroke-width="1" opacity="0.3"/>
  <line x1="1440" y1="820" x2="1440" y2="1080" stroke="#8a6030" stroke-width="1" opacity="0.3"/>
  <!-- Window with morning light -->
  <rect x="650" y="180" width="620" height="460" fill="#f5d860" stroke="#a08060" stroke-width="6" rx="4"/>
  <!-- Window crossbars -->
  <rect x="955" y="180" width="12" height="460" fill="#a08060" stroke="none"/>
  <rect x="650" y="405" width="620" height="12" fill="#a08060" stroke="none"/>
  <!-- Light rays -->
  <polygon points="650,180 1270,180 1100,640 820,640" fill="#fff8e0" opacity="0.15"/>
  <!-- Prayer mat -->
  <rect x="700" y="820" width="520" height="140" fill="#5a7a9a" rx="4" stroke="#4a6a8a" stroke-width="2"/>
  <rect x="740" y="840" width="440" height="100" fill="#4a6a8a" rx="2" stroke="none"/>
  <!-- Small table -->
  <rect x="1400" y="700" width="200" height="20" fill="#8a6a4a" rx="3" stroke="#6a4a2a" stroke-width="2"/>
  <rect x="1420" y="720" width="20" height="100" fill="#8a6a4a"/>
  <rect x="1560" y="720" width="20" height="100" fill="#8a6a4a"/>
  <!-- Scroll on table -->
  <rect x="1460" y="680" width="80" height="20" fill="#e8d8c0" rx="3" stroke="#a08060" stroke-width="1"/>
  <!-- Baseboards -->
  <rect x="0" y="810" width="1920" height="15" fill="#a08060"/>
</svg>
